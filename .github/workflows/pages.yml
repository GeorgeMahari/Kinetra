# Publishes site/ to GitHub Pages: the parent's consent page (https://georgemahari.github.io/Kinetra/consent/).
# The page's texts are the API's own (supabase/functions/api/modules/consent/pages.json), copied in here.
# One-time setup: repository Settings > Pages > Source: "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "supabase/functions/api/modules/consent/pages.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp supabase/functions/api/modules/consent/pages.json _site/consent/texts.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
